<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Page not found | ArcPace</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<style>
  :root { --bg:#F1F3F7; --ink:#0E1218; --dim:rgba(14,18,24,0.70); --accent:#07734F; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#07090F; --ink:#F4F6FB; --dim:rgba(244,246,251,0.62); --accent:#3DDC97; color-scheme:dark; }
  }
  :root[data-theme="dark"] { --bg:#07090F; --ink:#F4F6FB; --dim:rgba(244,246,251,0.62); --accent:#3DDC97; color-scheme:dark; }
  html { background:var(--bg); color:var(--ink); }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; box-sizing:border-box; text-align:center;
         font:17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
  img { width:80px; height:80px; border-radius:18px; margin:0 auto 20px; display:block; }
  h1 { font-size:34px; letter-spacing:-0.02em; margin:0 0 8px; }
  p { color:var(--dim); margin:0 0 24px; }
  nav { display:flex; gap:20px; justify-content:center; flex-wrap:wrap; }
  a { color:var(--accent); text-decoration:none; font-weight:600; padding:8px 0; }
  a:hover { text-decoration:underline; }
</style>
<script>
  try { var t = localStorage.getItem('arcpace-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<main>
  <img src="/img/icon.png" alt="ArcPace">
  <h1>Wrong turn.</h1>
  <p>This page doesn’t exist. Happens on long runs too.</p>
  <nav><a href="/">Home</a><a href="/calculator/">Calculator</a><a href="/guides/">Guides</a></nav>
</main>
</body>
</html>
